<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 通信しない作り：外部の読み込み・送信はブラウザがすべて遮断する -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>MyDataGuard 事業者向けデモ（架空のデータ）</title>
<style>
/* 事業者向けデモ：左に店が使う「MyDataGuard 事業者コンソール」、右にお客さまのスマホ。
   一番上の濃い灰色の帯は「デモ操作」で、製品の画面ではない。
   1280×800 で録画する前提。幅 760px 以下では店とお客さまをタブで切り替える。
   見た目はよくある B2B SaaS の管理画面にそろえる：白と淡い灰の地、1px の線、青のアクセント1色。
   成功は緑、注意は琥珀。赤は使わない。角丸は 8px（小物 6px）、影はごく弱く。
   文字：28（件数の数字）/ 20（見出し）/ 16 / 14（本文）/ 13（表）/ 12（補足）。太さは 400/500/600。 */
:root{
  --bg:#F7F8FA; --panel:#FFFFFF; --side:#FAFAFB; --line:#E5E7EB; --line2:#D1D5DB; --hover:#F3F4F6; --head:#F9FAFB;
  --text:#111827; --text2:#374151; --sub:#6B7280; --faint:#9CA3AF;
  --blue:#2563EB; --blue-h:#1D4ED8; --blue-bg:#EFF6FF; --blue-line:#DBEAFE; --blue-ink:#1E40AF;
  --ok:#047857; --ok-bg:#ECFDF5; --ok-dot:#10B981;
  --warn:#B45309; --warn-bg:#FFFBEB; --warn-line:#FDE68A;
  --demo:#1F2937; --demo2:#374151; --demo-t:#D1D5DB;
  /* 英数字は端末の UI 書体（Mac は SF、Windows は Segoe UI）、和文はゴシック。業務 SaaS で一般的な組み合わせ */
  --jp:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  --r:8px; --rs:6px;
  --sh:0 1px 2px rgba(16,24,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#E5E7EB;font-family:var(--jp);color:var(--text);font-size:14px;font-weight:400;line-height:1.55;letter-spacing:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;display:flex;align-items:center;justify-content:center;word-break:auto-phrase}
h1,h2,h3,p,ol,ul,dl,dd{margin:0}
ol,ul{padding:0;list-style:none}
p{text-wrap:pretty}
b,strong{font-weight:600}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums lining-nums}
.ic{width:18px;height:18px;flex:none}

@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .2s ease-out}
  .slide{animation:slide .24s ease-out}
}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none} }
@keyframes slide{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1} }
html.test *{animation:none!important;transition:none!important}

/* 全体 */
.app{width:1280px;height:800px;background:var(--bg);display:grid;grid-template-rows:40px minmax(0,1fr);overflow:hidden}

/* ===== デモ操作（製品の外） ===== */
.demo{background:var(--demo);color:var(--demo-t);display:flex;align-items:center;gap:16px;padding:0 16px;font-size:13px;white-space:nowrap}
.demo-l{flex:none;font-size:12px;font-weight:600;color:#fff;background:var(--demo2);border-radius:4px;padding:2px 8px;line-height:18px}
.steps{display:flex;align-items:center;gap:4px;flex:none}
.steps li{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 4px;border-radius:999px;font-size:12px;color:#9CA3AF;line-height:20px}
.steps .n{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;line-height:1;border:1px solid #4B5563}
.steps li.past{color:var(--demo-t)}
.steps li.past .n{border-color:#6B7280}
.steps li.on{background:#fff;color:var(--text);font-weight:600}
.steps li.on .n{background:var(--blue);border-color:var(--blue);color:#fff}
.scene{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-wrap:nowrap;white-space:nowrap;color:#F9FAFB;padding-left:16px;border-left:1px solid #4B5563}
.demo-r{display:flex;align-items:center;gap:12px;flex:none}
.demo-note{font-size:12px;color:#9CA3AF}
.demo-btn{font-size:12px;color:#fff;border:1px solid #4B5563;border-radius:6px;padding:3px 10px;line-height:18px}
.demo-btn:hover{background:var(--demo2)}
.mtabs{display:none}
.main{display:grid;grid-template-columns:1fr 324px;min-height:0}

/* ===== 左：事業者コンソール ===== */
.console{display:grid;grid-template-columns:208px 1fr;min-height:0;background:var(--panel);border-right:1px solid var(--line);position:relative;overflow:hidden}
.sb{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0 12px 10px;min-height:0;position:relative}
.sb-brand{height:52px;display:flex;align-items:center;gap:8px;padding:0 6px}
.sb-brand svg{width:24px;height:24px;flex:none}
.sb-brand b{font-size:15px;font-weight:600;color:var(--text);line-height:1.2;display:block}
.sb-brand small{display:block;font-size:12px;color:var(--sub);line-height:1.3}
.sb-shop{width:100%;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 8px;box-shadow:var(--sh)}
.sb-shop:hover{border-color:var(--line2)}
.av{flex:none;display:inline-grid;place-items:center;font-weight:600;color:var(--blue-ink);background:var(--blue-bg)}
.sb-shop .av{width:28px;height:28px;border-radius:6px;font-size:13px}
.sb-shop span.t{flex:1;min-width:0;line-height:1.3}
.sb-shop span.t b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-shop span.t small{display:block;font-size:12px;color:var(--sub)}
.sb-shop .ic{width:16px;height:16px;color:var(--faint)}
.menu{position:absolute;left:12px;right:12px;top:110px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 24px -6px rgba(16,24,40,.16);padding:4px}
.menu .mh{font-size:12px;color:var(--sub);padding:6px 8px 4px}
.menu button{width:100%;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--rs);font-size:13px}
.menu button:hover{background:var(--hover)}
.menu button .av{width:22px;height:22px;border-radius:5px;font-size:12px}
.menu button .ic{margin-left:auto;width:16px;height:16px;color:var(--blue)}
.sb-nav{margin-top:12px;display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--rs);font-size:14px;color:var(--text2);white-space:nowrap}
.nv .ic{color:var(--sub)}
.nv:hover{background:var(--hover)}
.nv[aria-current="page"]{background:var(--blue-bg);color:var(--blue-ink);font-weight:500}
.nv[aria-current="page"] .ic{color:var(--blue)}
.nv .cnt{margin-left:auto;font-size:12px;color:var(--sub)}
.sb-idea{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.sb-sec{display:flex;align-items:center;gap:6px;padding:0 10px 4px;font-size:12px;color:var(--sub);white-space:nowrap}
.soon{display:inline-block;font-size:12px;line-height:18px;padding:0 6px;border-radius:999px;background:var(--hover);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.sb-idea button{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;font-size:13px;color:var(--faint);white-space:nowrap;border-radius:var(--rs)}
.sb-idea button .ic{width:16px;height:16px}
.sb-idea p{font-size:12px;color:var(--sub);padding:4px 10px 0;line-height:1.5}
.sb-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 6px 0;border-top:1px solid var(--line)}
.sb-user .av{width:32px;height:32px;border-radius:50%;font-size:13px}
.sb-user span.t{flex:1;line-height:1.35;min-width:0}
.sb-user b{display:block;font-size:13px;font-weight:500}
.sb-user small{display:block;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-user .ic{width:16px;height:16px;color:var(--faint)}

.cmain{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{height:52px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);white-space:nowrap}
.crumb .ic{width:14px;height:14px;color:var(--faint)}
.crumb b{color:var(--text);font-weight:500}
.search{margin-left:auto;width:220px;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:var(--rs);background:var(--head);font-size:13px;color:var(--faint)}
.search .ic{width:16px;height:16px}
.search kbd{margin-left:auto;font:inherit;font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:18px;background:var(--panel)}
.ib{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--rs);color:var(--sub);position:relative}
.ib:hover{background:var(--hover)}
.ib .dotn{position:absolute;top:1px;right:-3px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--blue);color:#fff;font-size:12px;line-height:16px;font-weight:600;text-align:center;box-shadow:0 0 0 2px var(--panel)}
.page{flex:1;min-height:0;padding:14px 20px 16px;overflow:hidden;display:flex;flex-direction:column}
.page>.phead{flex:none}
/* 処理件数：明細の枠を画面の下端まで伸ばし、件数の行を枠の下に置く（表の下が中途半端に空かないように） */
#tab-count:not([hidden]){flex:1;min-height:0;display:flex;flex-direction:column}
.dcard{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.dcard .dbody{flex:1;min-height:0;overflow:hidden}
.dcard .dt tr:last-child td{border-bottom:1px solid var(--line)}
.dfoot{flex:none;height:42px;display:flex;align-items:center;padding:0 16px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.phead{display:flex;align-items:center;gap:10px;height:36px;margin-bottom:12px}
.phead h1{font-size:20px;font-weight:600;line-height:1.3;white-space:nowrap}
.phead .pill{font-size:12px;color:var(--sub);background:var(--hover);border-radius:999px;padding:0 8px;line-height:20px}
.phead .act{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{vertical-align:middle;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--rs);font-size:14px;font-weight:500;white-space:nowrap}
.btn .ic{width:16px;height:16px}
.btn.pri{background:var(--blue);color:#fff;box-shadow:var(--sh)}
.btn.pri:hover{background:var(--blue-h)}
.btn.pri:disabled{background:#BFCFF5;color:#fff;box-shadow:none}
.btn.sec{background:var(--panel);border:1px solid var(--line2);color:var(--text2);box-shadow:var(--sh)}
.btn.sec:hover{background:var(--head)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--rs);overflow:hidden;background:var(--panel)}
.seg button{font-size:13px;padding:0 12px;height:32px;color:var(--text2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--text);font-weight:500}

/* バッジ */
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.badge i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.ok i{background:var(--ok-dot)}
.badge.gray{background:var(--hover);color:var(--text2)}
.badge.gray i{background:var(--faint)}
.badge.blue{background:var(--blue-bg);color:var(--blue-ink)}
.badge.sm{height:18px;padding:0 6px}
.tagc{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:4px;font-size:12px;line-height:1;white-space:nowrap;color:var(--text2);background:var(--head);box-shadow:inset 0 0 0 1px var(--line)}
/* 表と宛先リストの中の状態は、塗りの札にせず「点＋文字」にする（札が1行に3つ並ぶのを避ける） */
.tbl .badge,.picks .badge,.field .badge{background:none;padding:0;height:auto;gap:6px;line-height:1.4}
.tbl .badge.blue{background:var(--blue-bg);padding:0 6px;height:18px;font-size:12px}

/* 会員一覧 */
.infobar{display:flex;align-items:flex-start;gap:8px;background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:var(--r);padding:9px 12px;font-size:13px;line-height:1.5;color:var(--blue-ink)}
.infobar .ic{width:16px;height:16px;color:var(--blue);margin-top:2px}
.infobar b{font-weight:600}
.fbar{display:flex;align-items:center;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--text2);background:var(--panel);white-space:nowrap}
.chip .c{font-size:12px;color:var(--sub)}
.chip[aria-pressed="true"]{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue-ink);font-weight:500}
.chip[aria-pressed="true"] .c{color:var(--blue-ink)}
.range{margin-left:auto;font-size:13px;color:var(--sub);white-space:nowrap}
.tw{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{height:34px;background:var(--head);font-size:12px;font-weight:500;color:var(--sub);text-align:left;padding:0 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{height:46px;padding:0 8px;font-size:13px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--text2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FBFCFD}
.tbl .r{text-align:right;padding-right:16px}
.tbl .cb{padding:0 0 0 14px}
.box{display:block;width:14px;height:14px;border:1px solid var(--line2);border-radius:4px;background:var(--panel)}
.idc{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.id{font-weight:500;color:var(--text);white-space:nowrap;letter-spacing:.01em}
.bdg{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:4px}
.bk{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.bk span{color:var(--text)}
.bk small{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl td.more{padding:0 6px 0 0;text-align:right}
.tbl td.more .ib{width:26px;height:26px}
.tbl tr.just td{background:#F5F9FF!important}
.tbl tr.just td:first-child{box-shadow:inset 3px 0 0 var(--blue)}
.pager{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.pages{display:flex;align-items:center;gap:2px}
.pages button,.pages span{min-width:28px;height:28px;display:inline-grid;place-items:center;border-radius:var(--rs);font-size:13px;color:var(--text2)}
.pages button[aria-current="page"]{background:var(--blue-bg);color:var(--blue-ink);font-weight:600}
.pages .ic{width:16px;height:16px}

/* コンソールのお知らせ（右上のトースト・閉じるまで残る） */
.ctoast{position:absolute;bottom:20px;right:20px;z-index:4;width:480px;display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 28px -8px rgba(16,24,40,.18),0 2px 4px rgba(16,24,40,.04);padding:12px 12px 12px 14px}
.ctoast .ti{width:20px;height:20px;flex:none;margin-top:1px}
.ctoast .ti.ok{color:var(--ok-dot)} .ctoast .ti.info{color:var(--blue)} .ctoast .ti.warn{color:#D97706}
.ctoast div{flex:1;min-width:0;line-height:1.5}
.ctoast b{display:block;font-size:14px;font-weight:600;color:var(--text)}
.ctoast span{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.ctoast .ib{width:24px;height:24px;margin:-2px -2px 0 0}
.ctoast .ib .ic{width:16px;height:16px}

/* 連絡 */
.sendgrid{display:grid;grid-template-columns:1fr 272px;gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.ch{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.ch small{font-size:12px;font-weight:400;color:var(--sub)}
.frow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.frow label{font-size:13px;color:var(--sub)}
.frow.tall{align-items:start}
.frow.tall label{padding-top:8px}
.field{min-height:36px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line2);border-radius:var(--rs);padding:4px 10px;font-size:14px;color:var(--text)}
.field.area{display:block;min-height:112px;padding:8px 10px;line-height:1.7}
.tok{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;border-radius:var(--rs);background:var(--hover);font-size:13px;font-weight:500;white-space:nowrap}
.field .hint{font-size:12px;color:var(--sub);margin-left:auto;white-space:nowrap}
.cfoot{display:flex;align-items:center;gap:16px;padding:12px 16px}
.reason{flex:1;font-size:13px;line-height:1.55;color:var(--sub)}
.reason.ng{display:flex;gap:8px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:var(--rs);padding:8px 10px}
.reason.ng .ic{width:16px;height:16px;margin-top:2px;color:#D97706}
.picks{max-height:600px;overflow:hidden}
.picks button{width:100%;display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);text-align:left}
.picks button:last-child{border-bottom:0}
.picks button:hover{background:#FBFCFD}
.picks .rd{width:16px;height:16px;border-radius:50%;border:1px solid var(--line2);background:var(--panel)}
.picks button[aria-checked="true"]{background:var(--blue-bg)}
.picks button[aria-checked="true"] .rd{border:5px solid var(--blue)}
.picks .pi{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.picks .pi b{font-size:13px;font-weight:500;white-space:nowrap}
.picks .pi small{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 処理件数 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{padding:16px 18px}
.kpi .kl{font-size:13px;font-weight:500;color:var(--text2);white-space:nowrap}
.kpi .ks{font-size:12px;color:var(--sub);white-space:nowrap}
.kpi .kv{display:flex;align-items:baseline;gap:4px;margin-top:10px}
.kpi .kv b{font-size:28px;font-weight:600;line-height:1.1;color:var(--text);font-variant-numeric:tabular-nums lining-nums}
.kpi .kv span{font-size:13px;color:var(--sub)}
.kpi .kd{margin-top:6px;font-size:12px;color:var(--sub)}
.kpi .kd.up{color:var(--ok)}
.note{display:flex;align-items:center;gap:6px;margin:12px 0 16px;font-size:12px;color:var(--sub)}
.note .ic{width:14px;height:14px}
.dt{width:100%;border-collapse:collapse;table-layout:fixed}
.dt th{height:34px;background:var(--head);font-size:12px;font-weight:500;color:var(--sub);text-align:left;padding:0 16px;border-bottom:1px solid var(--line)}
.dt td{height:42px;padding:0 16px;font-size:13px;border-bottom:1px solid var(--line);color:var(--text2)}
.dt tr:last-child td{border-bottom:0}
.dt td.empty{text-align:center;color:var(--sub);height:96px}

/* ===== 右：お客さまのスマホ ===== */

<script>
'use strict';
/* ===== 状態の計算（純粋な関数。画面には触らない。window.MDG から呼べる） ===== */
(function(){
  const ALPHA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // 0・1・I・O は読み違えやすいので使わない
  const copy=o=>JSON.parse(JSON.stringify(o));

  /* 乱数から MDG-XXXX-XXXX を1つ作る。rnd は 0以上1未満を返す関数 */
  function makeId(rnd){
    let s='';
    for(let i=0;i<8;i++) s+=ALPHA[Math.floor(rnd()*ALPHA.length)%ALPHA.length];
    return 'MDG-'+s.slice(0,4)+'-'+s.slice(4);
  }
  /* 番号に出してはいけない語（公開物に出さない社名など）。ソースの禁止語検査に掛からないよう逆さに書いて戻す */
  const BAD=['GFUM','JFU','KNAB'].map(w=>[...w].reverse().join(''));
  const hasBad=id=>{ const s=id.replace(/-/g,''); return BAD.some(w=>s.includes(w)); };
  function usedIds(st){
    const set=new Set();
    for(const sh in st.maps) for(const c in st.maps[sh]) set.add(st.maps[sh][c]);
    return set;
  }
  /* 店ごとの対応表（お客さま → 番号）から引く。なければ作る。同じ人×同じ店は同じ番号 */
  function issueId(st,cust,shop,rnd){
    const have=(st.maps[shop]||{})[cust];
    if(have) return {state:st,id:have,isNew:false};
    const used=usedIds(st); let id;
    do{ id=makeId(rnd); }while(used.has(id)||hasBad(id));
    const s=copy(st);
    if(!s.maps[shop]) s.maps[shop]={};
    s.maps[shop][cust]=id;
    return {state:s,id,isNew:true};
  }
  function peekId(st,cust,shop){ return (st.maps[shop]||{})[cust]||null; }
  function custOf(st,shop,id){
    const m=st.maps[shop]||{};
    for(const c in m) if(m[c]===id) return c;
    return null;
  }
  function member(st,shop,id){ return (st.members[shop]||[]).find(m=>m.id===id)||null; }
  function addBook(s,cust,shop,kind,text){ if(s.books[cust]) s.books[cust].push({at:s.clock,shop,kind,text}); }

  /* 予約（MyDataGuardで承認）。すでに会員なら会員を増やさず、初回特典も付けない */
  function reserve(st,shop,cust,o){
    const r=issueId(st,cust,shop,o.rnd);
    const s=copy(r.state); s.clock+=1;
    const name=s.shops[shop].name;
    if(member(s,shop,r.id)){
      s.log.push({at:s.clock,shop,kind:'dup',id:r.id,n:1});
      addBook(s,cust,shop,'dup',name+'に渡した：番号（2回目の申込・前と同じ番号）');
      return {state:s,id:r.id,dup:true};
    }
    s.members[shop].unshift({id:r.id,checks:o.checks.slice(),booking:o.booking,date:o.date,perk:'used',stopped:false,you:cust==='you'});
    s.log.push({at:s.clock,shop,kind:'reserve',id:r.id,n:1});
    addBook(s,cust,shop,'reserve',name+'に渡した：番号・確認の結果（'+o.checks.join('・')+'）');
    return {state:s,id:r.id,dup:false};
  }
  /* 送れるかどうか（本人が止めていたら送れない） */
  function canSend(st,shop,id){
    const m=member(st,shop,id);
    if(!m) return {ok:false,reason:'この番号の会員はいません'};
    if(m.stopped) return {ok:false,reason:'この番号は本人が停止中のため送れません。本人が通帳で再開すると、また送れます'};
    return {ok:true,reason:''};
  }
  /* 番号あてに送る。MyDataGuard が本人のメールへ中継する（店はアドレスを知らない） */
  function send(st,shop,id,tpl){
    const c=canSend(st,shop,id);
    if(!c.ok) return {state:st,ok:false,reason:c.reason};
    const s=copy(st); s.clock+=1;
    s.log.push({at:s.clock,shop,kind:'notify',id,n:1});
    const cust=custOf(s,shop,id);
    if(cust && s.msgs[cust]){
      s.msgs[cust].push({at:s.clock,shop,title:tpl.title,body:tpl.body});
      addBook(s,cust,shop,'notify',s.shops[shop].name+'から連絡が届いた：'+tpl.title);
    }
    return {state:s,ok:true,reason:''};
  }
  /* 本人が店ごとに連絡を止める／再開する */
  function setStop(st,shop,cust,stopped){
    const id=peekId(st,cust,shop);
    if(!member(st,shop,id)) return st;
    const s=copy(st); s.clock+=1;
    member(s,shop,id).stopped=stopped;
    addBook(s,cust,shop,stopped?'stop':'restart',s.shops[shop].name+(stopped?'からの連絡を止めた':'からの連絡を再開した'));
    return s;
  }
  function isStopped(st,shop,cust){ const m=member(st,shop,peekId(st,cust,shop)); return !!(m&&m.stopped); }
  /* 今月の処理件数（金額は出さない） */
  function countFor(st,shop){
    const c={reserve:0,notify:0,dup:0};
    st.log.forEach(e=>{ if(e.shop===shop) c[e.kind]+=e.n; });
    return c;
  }
  function totalMembers(st,shop){
    return st.shops[shop].others+st.members[shop].length;
  }

  /* はじめの状態（すべて架空）。seeds：[お客さま, 確認の結果, 最終予約, 登録日, 停止中か, 来店回数] */

        <div class="kd${n?' up':''}">このデモで +${n}</div></div>`; };
    return `<div class="kpis">
        ${kpi('reserve','予約','MyDataGuardで受けた予約')}
        ${kpi('notify','連絡','番号あてに送った連絡')}
        ${kpi('dup','2回目の申込','同じ人・特典なし')}
      </div>
      <p class="note">${I.info}料金は検討中です。11月1日〜7日の件数を表示しています</p>
      <div class="card dcard">
        <div class="ch">明細<small>このデモで行った処理</small></div>
        <div class="dbody">
        <table class="dt" aria-label="このデモで行った処理">
          <colgroup><col style="width:150px"><col style="width:220px"><col></colgroup>
          <thead><tr><th>日時</th><th>処理</th><th>会員番号</th></tr></thead>
          <tbody>${mine.length?mine.slice().reverse().map(e=>`<tr><td class="num">${tm(e.at)}</td><td>${label[e.kind]}</td><td class="id num">${e.id}</td></tr>`).join('')
            :'<tr><td class="empty" colspan="3">このデモで行った処理は、まだありません</td></tr>'}</tbody>
        </table>
        </div>
        <div class="dfoot"><span class="num">${mine.length}件</span></div>
      </div>`;
  }
  function consoleToast(k){
    const n=ui.news[k]; if(!n||n.kind==='join') return '';
    const tpl=st.shops[k].tpl;
    const box=(kind,icon,b,sp)=>`<div class="ctoast fade" role="status"><span class="ti ${kind}">${icon}</span><div><b>${b}</b><span>${sp}</span></div><button class="ib" data-act="dismiss" aria-label="閉じる">${I.x}</button></div>`;
    if(n.kind==='dup') return box('info',I.info,`すでに会員です（同じ番号 ${n.id}）`,'別のメールアドレスでの申込でしたが、同じ人です。初回特典は1回目の予約で使用済みのため付けていません');
    if(n.kind==='sent') return box('ok',I.checkc,`${n.id} あてに「${tpl.title}」を送りました`,'番号あてに送信。宛先のメールアドレスは店に表示されません');
    if(n.kind==='stopped') return box('warn',I.warn,`${n.id} は本人が連絡を止めました`,'この番号には送れません。本人が再開すると、また送れます');
    if(n.kind==='restarted') return box('ok',I.checkc,`${n.id} は本人が連絡を再開しました`,'この番号に、また送れます');
    return '';
  }
  function renderShop(){
    const k=ui.shop, s=st.shops[k], total=M.totalMembers(st,k);
    const head={
      members:`<h1>会員</h1><span class="pill num">${total}</span><div class="act"><button class="btn sec" type="button" title="デモでは使えません">${I.down}CSVで書き出す</button></div>`,
      send:`<h1>連絡</h1><div class="act"><button class="btn sec" type="button" title="デモでは使えません">送信の履歴</button><button class="btn pri" type="button">${I.plus}連絡を作成</button></div>`,
      count:`<h1>処理件数</h1><div class="act"><div class="seg" role="group" aria-label="期間"><button aria-pressed="true" type="button">今月</button><button aria-pressed="false" type="button">先月</button><button aria-pressed="false" type="button">期間を指定</button></div></div>`
    }[ui.stab];
    $('shop').innerHTML=`${sidebar(k)}
      <div class="cmain">
        <div class="top">
          <div class="crumb">${s.name}${I.chevR}<b>${TITLE[ui.stab]}</b></div>
          <div class="search">${I.search}会員番号で検索<kbd>/</kbd></div>
          <button class="ib" type="button" aria-label="お知らせ ${ui.bell}件">${I.bell}<span class="dotn num">${ui.bell}</span></button>
          <button class="ib" type="button" aria-label="ヘルプ">${I.help}</button>
        </div>
        ${consoleToast(k)}
        <div class="page">
          <div class="phead">${head}</div>
          <div id="tab-members" ${ui.stab==='members'?'':'hidden'}>${Object.keys(st.shops).map(membersBlock).join('')}</div>
          <div id="tab-send" ${ui.stab==='send'?'':'hidden'}>${sendTab(k)}</div>
          <div id="tab-count" ${ui.stab==='count'?'':'hidden'}>${countTab(k)}</div>
        </div>
      </div>`;
  }

  /* ---- 右：お客さまのスマホ ---- */
  function pageView(){
    const k=ui.shop, s=st.shops[k], c=s.course, L=LOOK[k], myId=M.peekId(st,'you',k), joined=!!(myId&&M.member(st,k,myId));
    const note=ui.pnote[k];
    const done=note==='dup'
      ? `<div class="done info"><div class="dh">${I.info}この店では、すでに会員です</div><p>番号は前と同じ <span class="id num">${myId}</span> です。初回特典は1回目の予約で使っています</p></div>`
      : `<div class="done"><div class="dh">${I.checkc}予約しました</div><p>${c.short}<br>店に渡したのは番号 <span class="id num">${myId}</span> と確認の結果だけです。</p><button class="lnk" data-act="pview" data-v="book">MyDataGuardの通帳を見る</button></div>`;
    return `<div class="addr">${I.lock}${L.dom}</div>
      <div class="shd"><span class="lg" style="background:${L.col}">${L.ini}</span><b>${s.name}</b>${I.menu}</div>
      <div class="hero ${k}"><span>${L.cat}</span></div>
      <div class="pc">
        <div class="ptitle">${c.title}</div>
        <ul class="pmeta">
          <li>${I.cal}${c.when}</li>
          <li>${I.yen}${c.price}<span class="seat">${c.seats}</span></li>
          ${c.note?`<li>${I.person}${c.note}</li>`:''}
        </ul>
        <div class="perk"><b>初回特典</b>${c.perk}</div>
        ${joined?done:`<button class="mdgbtn" id="p-reserve" data-act="reserve">${LOGOW}MyDataGuardで予約</button>
          <p class="mdgsub">名前・住所・電話・メールの入力はありません</p>
          <button class="alt" type="button">通常の会員登録はこちら</button>`}
      </div>`;
  }
  function approveView(){
    const p=ui.pending; if(!p) return '';
    const s=st.shops[p.shop], ageAsk=s.asks.includes('20歳以上');
    const CB=on=>`<span class="cbx${on?'':' off'}">${I.check}</span>`;
    return `<div class="grab"></div>
      <div class="shh">${LOGO}MyDataGuard<button class="x ib" data-act="cancel" aria-label="閉じる">${I.x}</button></div>
      <div class="sht">${s.name}に、予約に必要な情報を渡します<small>${p.dup?'初回特典つきで、もう一度申し込みます':'予約を申し込みます'}</small></div>
      <div class="acct"><span class="av">山</span><span class="t"><b>${YOU.name}</b><small>${p.dup?YOU.sub:YOU.email}</small></span></div>
      <div class="shl">店に渡るもの</div>
      <ul class="perm">
        <li>${CB(true)}<span class="pt"><b>会員番号</b><small><span class="num">${p.id}</span>・${p.dup?'前と同じ番号':'この店だけの番号'}</small></span></li>
        <li>${CB(true)}<span class="pt"><b>メール確認済み</b><small>確認の結果だけ。アドレスは渡しません</small></span></li>
        ${ageAsk?`<li><button id="p-age" role="checkbox" data-act="age" aria-checked="${p.age}">${CB(p.age)}<span class="pt"><b>20歳以上</b><small>本人が選びます。生年月日は渡しません</small></span></button></li>`:''}
        <li>${CB(true)}<span class="pt"><b>予約</b><small>${s.course.short}</small></span></li>
      </ul>
      <div class="shl">店に渡らないもの</div>
      <div class="noperm"><s>名前</s><s>住所</s><s>電話</s><s>メール</s></div>
      <div class="shb"><button class="pbtn ghost" data-act="cancel">やめる</button><button class="pbtn" id="p-approve" data-act="approve">承認</button></div>`;
  }
  function homeView(){
    const ks=Object.keys(st.shops).filter(k=>M.member(st,k,M.peekId(st,'you',k)));
    const last=st.msgs.you[st.msgs.you.length-1];
    return `<div class="ah"><h2>ホーム</h2><p>${YOU.name}さん</p></div>
      <div class="apb">
        <div class="hl">つながっている店</div>
        ${ks.length?ks.map(k=>`<div class="acard"><div class="ar"><span class="lg" style="background:${LOOK[k].col}">${LOOK[k].ini}</span><b>${st.shops[k].name}</b></div><div class="bid">会員番号 <span class="num">${M.peekId(st,"you",k)}</span></div></div>`).join('')
          :'<p class="empty">まだありません。店で「MyDataGuardで予約」を使うと、ここに出ます</p>'}
        <div class="hl">最近のお知らせ</div>
        ${last?`<div class="acard"><div class="ar"><b>${st.shops[last.shop].name}</b><span class="num">${tm(last.at).slice(5)}</span></div><h3>${last.title}</h3></div>`:'<p class="empty">まだ連絡はありません</p>'}
      </div>`;
  }
  function msgsView(){
    const list=st.msgs.you.slice().reverse();
    return `<div class="ah"><h2>お知らせ</h2><p>店から番号あてに送られた連絡</p></div>
      <div class="apb">${list.length?list.map(m=>`<div class="acard">
        <div class="ar"><span class="lg" style="background:${LOOK[m.shop].col}">${LOOK[m.shop].ini}</span><b>${st.shops[m.shop].name}</b><span class="num">${tm(m.at).slice(5)}</span></div>
        <h3>${m.title}</h3><p>${m.body}</p>
        <div class="via">MyDataGuard が ${YOU.email} に中継しました。店はこのアドレスを知りません</div>
      </div>`).join(''):'<p class="empty">まだ連絡はありません</p>'}</div>`;
  }
  function bookView(){
    const lines=st.books.you, order=[];
    lines.forEach(l=>{ if(!order.includes(l.shop)) order.push(l.shop); });
    return `<div class="ah"><h2>情報の通帳</h2><p>どの店に何を渡したか</p></div>
      <div class="apb">
      <p class="me">あなたの名前・メールは MyDataGuard にあります：${YOU.name}・${YOU.email}</p>
      ${order.length?order.map(k=>{
        const id=M.peekId(st,'you',k), off=M.isStopped(st,k,'you');
        const mine=lines.map((l,i)=>[l,i]).filter(([l])=>l.shop===k).reverse();
        return `<div class="acard" data-shop="${k}">
          <div class="ar"><span class="lg" style="background:${LOOK[k].col}">${LOOK[k].ini}</span><b>${st.shops[k].name}</b></div><div class="bid">この店での番号 <span class="num">${id}</span></div>
          <div class="bst"><span>店からの連絡</span>${off?'<span class="badge gray"><i></i>止めています</span>':'<span class="badge ok"><i></i>届く</span>'}</div>
          <button class="stopbtn${off?' on':''}" data-act="stop" data-stop="${k}">${off?'連絡を再開する':'この店からの連絡を止める'}</button>
          <ol class="lines">${mine.map(([l,i])=>`<li class="${i===ui.newBook?'new':''}"><span class="tm num">${tm(l.at).slice(5)}</span><span>${l.text}</span></li>`).join('')}</ol>
        </div>`;}).join('')
      :'<p class="empty">まだ記録はありません。店で予約すると、ここに1行ずつ記録されます</p>'}</div>`;
  }
  function renderPhone(){
    const v=ui.pview, unread=st.msgs.you.length, app=['home','msgs','book'].includes(v), k=ui.shop;
    const joined=!!M.member(st,k,M.peekId(st,'you',k));
    const tabs=[['home','ホーム',I.home],['book','通帳',I.book],['msgs','お知らせ',I.bell]];
    $('phone').innerHTML=`
      <div class="sbar"><span class="num">${tm(st.clock).slice(5)}</span><span class="island"></span><span class="sic">${SIG}${WIFI}${BATT}</span></div>
      ${ui.toast?`<button class="ptoast fade" id="toast" data-act="toast">${LOGO}<div><span class="pa"><span>MyDataGuard</span><span>今</span></span><b>${st.shops[ui.toast.shop].name}から連絡が届きました</b><span class="s">${ui.toast.title}（MyDataGuard の中継）</span></div></button>`:''}
      <div class="pv">
        <div id="v-page" ${v==='page'||v==='approve'?'':'hidden'}>${pageView()}</div>
        <div id="v-home" ${v==='home'?'':'hidden'}>${homeView()}</div>
        <div id="msgs" ${v==='msgs'?'':'hidden'}>${msgsView()}</div>
        <div id="book" ${v==='book'?'':'hidden'}>${bookView()}</div>
      </div>
      ${app?`<nav class="tabbar" aria-label="MyDataGuard アプリ">${tabs.map(([x,l,icon])=>`<button data-act="pview" data-v="${x}"${v===x?' aria-current="page"':''}>${icon}${l}${x==='msgs'&&unread?`<span class="bd num">${unread}</span>`:''}</button>`).join('')}</nav>`:''}
      ${v==='approve'?`<div class="scrim"></div><div class="sheet slide" id="v-approve">${approveView()}</div>`:''}
      <span class="hbar"></span>`;
    $('pdemo').innerHTML=`
      <div class="dr"><span>店のページ</span>${Object.keys(st.shops).map(x=>`<button class="dbtn" data-act="pshop" data-shop="${x}" aria-pressed="${!app&&x===k}">${st.shops[x].name}</button>`).join('')}</div>
      <div class="dr"><button class="dbtn" data-act="papp" aria-pressed="${app}">MyDataGuardアプリ</button><button class="dbtn" id="p-again" data-act="again" ${joined?'':'disabled'} title="${joined?'':'1回目の予約のあとで試せます'}">別のメールで再申込</button></div>`;
  }

  function render(){ renderTop(); renderShop(); renderPhone(); }

  /* ---- 操作 ---- */
  function openApprove(dup){
    const k=ui.shop, r=M.issueId(st,'you',k,rnd);
    st=r.state;
    ui.pending={shop:k,id:r.id,dup,age:true};
    ui.pview='approve'; ui.scene=dup?'dupApprove':'approve';
  }
  function showToast(t){
    ui.toast=t;
    clearTimeout(toastTimer);
    if(!testMode) toastTimer=setTimeout(()=>{ ui.toast=null; renderPhone(); },6000);
  }
  const ACT={
    reserve(){ openApprove(false); },
    again(){ openApprove(true); },
    age(){ ui.pending.age=!ui.pending.age; },
    cancel(){ ui.pending=null; ui.pview='page'; ui.scene='start'; },
    approve(){
      const p=ui.pending, s=st.shops[p.shop];
      const checks=s.asks.filter(c=>c!=='20歳以上'||p.age);
      const r=M.reserve(st,p.shop,'you',{checks,booking:s.course.short,date:TODAY,rnd});
      st=r.state; ui.pending=null; ui.shop=p.shop; ui.stab='members'; ui.pview='page'; ui.filter='all';
      ui.news[p.shop]={kind:r.dup?'dup':'join',id:r.id}; ui.bell++;
      ui.pnote[p.shop]=r.dup?'dup':'join';
      ui.just=r.dup?null:r.id; ui.newBook=st.books.you.length-1;
      ui.scene=r.dup?'dupDone':'reserved'; ui.dot='shop';
    },
    stab(el){ ui.stab=el.dataset.stab; ui.just=null; delete ui.news[ui.shop]; if(ui.stab==='count') ui.scene='count'; else if(ui.stab==='send') ui.scene=M.isStopped(st,ui.shop,'you')?'stopped':'send'; },
    pick(el){ ui.sel[ui.shop]=el.dataset.id; },
    send(el){
      const k=ui.shop, r=M.send(st,k,el.dataset.id,st.shops[k].tpl);
      if(!r.ok) return;
      st=r.state; ui.sel[k]=el.dataset.id;
      ui.news[k]={kind:'sent',id:el.dataset.id}; ui.bell++;
      if(M.custOf(st,k,el.dataset.id)==='you'){ showToast({shop:k,title:st.shops[k].tpl.title}); ui.newBook=st.books.you.length-1; ui.dot='phone'; }
      ui.scene='sent';
    },
    toast(){ ui.toast=null; ui.pview='msgs'; },
    pview(el){ ui.pview=el.dataset.v; if(ui.pview!=='approve') ui.pending=null; },
    papp(){ ui.pview='home'; ui.pending=null; },
    stop(el){
      const k=el.dataset.stop, off=!M.isStopped(st,k,'you');
      st=M.setStop(st,k,'you',off); ui.shop=k;
      ui.news[k]={kind:off?'stopped':'restarted',id:M.peekId(st,'you',k)}; ui.bell++;
      ui.newBook=st.books.you.length-1; ui.scene=off?'stopped':'restarted'; ui.dot='shop';
    },
    pshop(el){ ui.shop=el.dataset.shop; ui.pview='page'; ui.pending=null; ui.just=null; ui.scene=ui.shop==='hidamari'?'start':'other'; },
    sshop(el){ ui.shop=el.dataset.shop; ui.just=null; },
    menu(){ ui.menu=!ui.menu; },
    filter(el){ ui.filter=el.dataset.v; },
    dismiss(){ delete ui.news[ui.shop]; },
    m(el){ ui.m=el.dataset.v; if(ui.dot===ui.m) ui.dot=null; },
    reset(){ clearTimeout(toastTimer); fresh(); }
  };
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-act]');
    if(!el||el.disabled) return;
    const f=ACT[el.dataset.act]; if(!f) return;
    if(el.dataset.act!=='send'){ ui.toast=null; clearTimeout(toastTimer); }
    if(el.dataset.act!=='menu') ui.menu=false;
    f(el); render();
  });

  /* ===== テスト用の入口：#t_名前 で、その操作を順に自動で行う（末尾 _phone で幅の狭い画面はスマホ側を表示） ===== */
  function tap(sel){
    const el=document.querySelector(sel);
    if(!el) throw new Error('見つかりません: '+sel);
    if(el.disabled) throw new Error('押せません: '+sel);
    el.click();
  }
  const reserveSteps=['#p-reserve','#p-approve'];
  const SCN={
    t_base:[],
    t_approve:['#p-reserve'],
    t_reserve:reserveSteps,
    t_notify:[...reserveSteps,'[data-stab="send"]','#send-btn','#toast'],
    t_dup:[...reserveSteps,'#p-again','#p-approve'],
    t_stop:[...reserveSteps,'[data-act="pview"][data-v="book"]','[data-stop="hidamari"]','[data-stab="send"]'],
    t_restart:[...reserveSteps,'[data-act="pview"][data-v="book"]','[data-stop="hidamari"]','[data-stop="hidamari"]','[data-stab="send"]'],
    t_twoshops:[...reserveSteps,'[data-act="pshop"][data-shop="aoba"]','#p-reserve','#p-approve','[data-act="pview"][data-v="book"]'],
    t_count:[...reserveSteps,'[data-stab="send"]','#send-btn','#send-btn','#p-again','#p-approve','[data-stab="count"]']
  };
  function pureCheck(){
    let seed=7; const r=()=>{ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; };
    const s=M.initial(r), snap=JSON.stringify(s);
    const a1=M.issueId(s,'p','hidamari',r), a2=M.issueId(a1.state,'p','hidamari',r);
    const b1=M.issueId(a2.state,'p','aoba',r), c1=M.issueId(b1.state,'q','hidamari',r);
    const tpl={title:'前日のご案内',body:'x'};
    const t1=M.reserve(s,'hidamari','you',{checks:['メール確認済み'],booking:'x',date:'11/7',rnd:r}).state, t1snap=JSON.stringify(t1);
    const id=M.peekId(t1,'you','hidamari');
    const can_before=M.canSend(t1,'hidamari',id).ok;
    let t2=M.send(t1,'hidamari',id,tpl).state; t2=M.send(t2,'hidamari',id,tpl).state;
    const t3=M.reserve(t2,'hidamari','you',{checks:['メール確認済み'],booking:'x',date:'11/7',rnd:r}).state;
    const off=M.setStop(t3,'hidamari','you',true), on=M.setStop(off,'hidamari','you',false);
    const b=M.countFor(s,'hidamari'), a=M.countFor(t3,'hidamari');
    /* 乱数を「M U F G B V 2 2」の順に出す並びに固定し、そのあとは通常の乱数に戻す */
    const AL='23456789ABCDEFGHJKLMNPQRSTUVWXYZ', seq=[...'22VBGFUM'].reverse().map(c=>(AL.indexOf(c)+0.5)/32);
    const fr=()=>seq.length?seq.shift():r();
    const forced=M.issueId(M.initial(r),'z','hidamari',fr).id;
    return {a1:a1.id,a2:a2.id,b1:b1.id,c1:c1.id,a1_new:a1.isNew,a2_new:a2.isNew,
      can_before,can_stopped:M.canSend(off,'hidamari',id).ok,reason_stopped:M.canSend(off,'hidamari',id).reason,
      can_restarted:M.canSend(on,'hidamari',id).ok,
      count:{reserve:a.reserve-b.reserve,notify:a.notify-b.notify,dup:a.dup-b.dup},
      unchanged:JSON.stringify(s)===snap&&JSON.stringify(t1)===t1snap,forced};
  }
  function runTest(name){
    document.documentElement.classList.add('test');
    let base=name;
    if(base.endsWith('_phone')){ base=base.slice(0,-6); ui.m='phone'; render(); }
    if(base==='t_pure') $('t-out').textContent=JSON.stringify(pureCheck());
    else (SCN[base]||[]).forEach(tap);
    if(name.endsWith('_phone')){ ui.m='phone'; ui.dot=null; render(); }
    document.body.dataset.scenarioDone=base;
  }

  fresh(); render();
  if(testMode) runTest(location.hash.slice(1));
})();
</script>
