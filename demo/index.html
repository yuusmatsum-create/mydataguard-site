<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MyDataGuard デモ（架空のデータ）</title>
<meta name="description" content="MyDataGuard の画面の流れを、架空のデータで試せるデモです。メールは読み取りません。">
<style>
/* 紺の墨と紙の白。強調色は朱1色（漏えいの要対応だけ）。主役の「物」は紺のカード1枚
   文字の大きさは4段階（40 / 20 / 15 / 12）、太さは2段階（400 / 600）。角丸は12pxの1種類。ボタンの高さは48px */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#13223A; --ink2:#1E3150; --text:#1B2433; --sub:#6B6F76; --line:#E3E1DA; --press:#EEECE6; --accent:#B8432F;
  --jp:"Hiragino Sans","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif;
  --num:"Segoe UI","Helvetica Neue","Hiragino Sans",sans-serif;
  --t1:40px; --t2:20px; --t3:15px; --t4:12px;
  --r:12px; --h:48px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#DCDAD4;font-family:var(--jp);color:var(--text);font-size:var(--t3);line-height:1.6;padding:0 16px 24px;-webkit-font-smoothing:antialiased}
h1,h2,p{margin:0}
h1,h2,.lead,.t,.note,.hint,.confirm,#demo-banner p{word-break:auto-phrase;text-wrap:pretty}
h1{text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left;-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums;letter-spacing:0}
.unit{font-size:var(--t4);margin-left:2px;font-weight:400}

/* デモであることを示す帯（スマホ枠の外、ページの最上部） */
#demo-banner{margin:0 -16px 24px;background:var(--surface);border-bottom:1px solid var(--line);padding:16px}
#demo-banner .in{max-width:560px;margin:0 auto;display:grid;gap:8px}
#demo-banner p{font-size:var(--t4);color:var(--text);line-height:1.8}
#demo-banner p b{font-weight:600;color:var(--ink)}
#demo-banner nav{display:flex;flex-wrap:wrap;gap:4px 24px;font-size:var(--t4)}
#demo-banner a,#demo-banner button{color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:var(--t4);min-height:32px;display:inline-flex;align-items:center}

.phone{max-width:390px;margin:0 auto;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;height:800px;display:flex;flex-direction:column;box-shadow:0 0 0 10px #15181D}
@media (max-width:430px){.phone{border-radius:24px;height:760px} }
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 24px 112px;scrollbar-width:none}
.screen.bare{padding-bottom:32px}
.screen::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion:no-preference){
  .screen.anim>*:not(.card){animation:fade .2s ease-out}
  .just{animation:just 1.6s ease-out}
}
@keyframes fade{from{opacity:0} to{opacity:1} }
@keyframes just{from{background:var(--press)} to{background:transparent} }

/* ヘッダー（マーク・サービス名・端末内の表示・利用者名・前回ログイン） */
.hd{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.brand{display:flex;align-items:center;gap:8px;font-size:var(--t4);font-weight:600;letter-spacing:.08em;color:var(--ink)}
.brand svg{width:20px;height:20px;flex:none}
.brand-sub{font-weight:400;letter-spacing:.02em;color:var(--sub);margin-left:2px}
.safe{display:flex;align-items:center;gap:4px;font-size:var(--t4);color:var(--sub)}
.safe svg{width:14px;height:14px}
.who{margin-top:16px;display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.who b{font-size:var(--t3);font-weight:600;color:var(--ink)}
.who span{font-size:var(--t4);color:var(--sub)}

/* 主役：紺のカード（これまで と これから の対比だけ） */
.card{margin-top:16px;background:var(--ink);color:#fff;border-radius:var(--r);padding:24px;display:grid;gap:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.card .k{font-size:var(--t4);color:rgba(255,255,255,.66);letter-spacing:.02em}
.card .n{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}
.card .n b{font-family:var(--num);font-weight:400;font-size:var(--t1);line-height:1;font-variant-numeric:tabular-nums}
.card .n b .unit{font-family:var(--jp);font-size:var(--t3);margin-left:4px;color:rgba(255,255,255,.8)}
.card .n small{font-size:var(--t4);color:rgba(255,255,255,.5)}
.card .vs{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:16px;border-top:1px solid rgba(255,255,255,.14);padding-top:16px}
.card .vs .k{color:rgba(255,255,255,.8)}
.card .vs b{font-family:var(--num);font-weight:400;font-size:var(--t2);font-variant-numeric:tabular-nums}
.card .vs b .unit{font-family:var(--jp);color:rgba(255,255,255,.8)}

/* ホーム：要約と入口 */
.sec .num{font-weight:400}
.sec+.src{margin-top:8px}
.lab{display:inline-flex;align-items:center;gap:8px}
.nomark{width:8px;height:8px;flex:none}
.row .act{font-size:var(--t4);color:var(--ink);font-weight:600;white-space:nowrap;text-align:right}
.row .cnt{font-size:var(--t3);color:var(--ink);white-space:nowrap;text-align:right}
.row.tight{min-height:48px;padding:8px 0}
.row.tight .nm{display:flex}
.more-row .nm{font-size:var(--t4);color:var(--ink);padding-left:16px}
.row .meta{padding-left:0}
.list .row[data-from] .meta{padding-left:16px}
/* 一覧画面 */
.search{margin-top:24px;width:100%;height:var(--h);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 16px;font:inherit;font-size:var(--t3);color:var(--text)}
.search:focus{outline:2px solid var(--ink);outline-offset:-1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;margin-top:16px}
.legend>span{display:inline-flex;gap:8px;align-items:center}

/* 要対応（漏えい） */
.attn{margin-top:16px;background:var(--surface);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);width:100%}
.attn:active{background:var(--press)}
/* 段階は形で分ける：塗り＝漏えい通知あり（会社からお詫び）／輪郭＝漏えいの可能性（企業の公表あり・対象か未確定） */
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.ring{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--accent);flex:none}
.chev{width:16px;height:16px;color:#A3A6AB;flex:none}

/* 切り替え */
.seg{margin-top:32px;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.seg button{text-align:center;min-height:var(--h);padding:8px 0;font-size:var(--t3);color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink);font-weight:600}
.filters{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.filters button{font-size:var(--t4);color:var(--sub);height:32px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);white-space:nowrap}
.filters button[aria-pressed="true"]{color:#fff;background:var(--ink);border-color:var(--ink)}
.filters .num{margin-left:4px}

/* 一覧 */
.list{margin-top:8px}
.row{display:grid;grid-template-columns:1fr auto 16px;gap:12px;align-items:center;min-height:64px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.row:active{background:var(--press)}
.row .nm{font-size:var(--t3);font-weight:400;line-height:1.4;min-width:0;color:var(--text)}
.row .meta{display:block;font-size:var(--t4);color:var(--sub);margin-top:4px;line-height:1.5}
.row .st{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:var(--t4);color:var(--sub);white-space:nowrap;min-width:64px}
.row .st.hot{color:var(--accent)}
.row .st.on{color:var(--ink);font-weight:600}
.row.off .nm{color:var(--sub)}
.note{margin-top:24px;font-size:var(--t4);color:var(--sub);line-height:1.8}
.lead{font-size:var(--t3);margin-top:16px;line-height:1.8}

/* これから：MyDataGuardがお預かりする情報（構想）の行 */
.src{margin-top:24px;width:100%;display:grid;grid-template-columns:1fr 16px;gap:12px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.src:active{background:var(--press)}
.src .k{font-size:var(--t4);color:var(--sub);display:block}
.src .nm{display:block;font-size:var(--t3);font-weight:600;margin-top:4px;line-height:1.5;color:var(--ink)}
.src .meta{display:block;font-size:var(--t4);color:var(--sub);margin-top:4px}
.sec{margin-top:32px;font-size:var(--t4);color:var(--sub);font-weight:600;letter-spacing:.04em}

/* タブバー */
.tabbar{position:absolute;left:0;right:0;bottom:0;background:rgba(246,245,241,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 24px 24px}
.tabbar[hidden]{display:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--t4);color:#9A9DA3;text-align:center;min-height:var(--h);border-radius:var(--r)}
.tabbar button:active{background:var(--press)}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabbar svg{width:24px;height:24px}
.tabbar .num{margin-left:4px}

/* 詳細 */
.back{font-size:var(--t4);color:var(--ink);display:inline-flex;gap:4px;align-items:center;min-height:40px;padding-right:16px}
.back svg{width:16px;height:16px}
.dh{margin-top:8px}
.dh .k{font-size:var(--t4);color:var(--sub)}
.dh h1{font-size:var(--t2);font-weight:600;line-height:1.4;margin-top:4px;color:var(--ink)}
.dh .stline{margin-top:8px;font-size:var(--t4);color:var(--sub);display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center}
.dh .stline .hot{color:var(--accent);display:inline-flex;align-items:center;gap:8px}
.dh .stline .on{color:var(--ink);font-weight:600}
.span2{margin-top:24px;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.span2 div{padding:16px;display:grid;gap:4px}
.span2 div+div{border-left:1px solid var(--line)}
.span2 span{font-size:var(--t4);color:var(--sub)}
.span2 b{font-weight:600;font-size:var(--t3);color:var(--ink)}
.blk{margin-top:32px}
.blk h2{font-size:var(--t4);color:var(--sub);font-weight:600;letter-spacing:.04em}
.kv{margin-top:8px;border-top:1px solid var(--line)}
.kv div{display:grid;grid-template-columns:1fr auto;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv div span{color:var(--sub)}
.kv div b{font-weight:600;color:var(--ink);text-align:right}
.hint{margin-top:8px;font-size:var(--t4);color:var(--sub);line-height:1.8}
.tl{list-style:none;margin:16px 0 0 3px;padding:0;border-left:1px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 20px;font-size:var(--t3);line-height:1.5}
.tl li:last-child{padding-bottom:0}
.tl li:before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--bg);border:1px solid var(--ink)}
.tl li.hot:before{background:var(--accent);border-color:var(--accent)}
.tl li.hot .tx,.tl li.maybe .tx{color:var(--accent)}
.tl li.maybe:before{background:var(--bg);border:1.5px solid var(--accent)}
.todo{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line);counter-reset:t}
.todo li{counter-increment:t;display:grid;grid-template-columns:24px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--t3);line-height:1.6}
.todo li:before{content:counter(t);font-family:var(--num);font-size:var(--t4);color:var(--sub);line-height:2}
.todo small{display:block;font-size:var(--t4);color:var(--sub);margin-top:4px}
/* 切り替えスイッチ */
.opt{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:16px;border-top:1px solid var(--line)}
.opt b{display:block;font-size:var(--t3);font-weight:600;color:var(--ink)}
.opt p{font-size:var(--t4);color:var(--sub);margin-top:4px;line-height:1.7}
.sw{width:48px;height:28px;border-radius:14px;background:#CFCCC4;position:relative;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--ink)}
.sw[aria-checked="true"]:after{left:23px}
.tl .dt{display:block;font-family:var(--num);font-size:var(--t4);color:var(--sub);font-variant-numeric:tabular-nums}
.cta{margin-top:40px;display:grid;gap:8px}
.primary,.secondary,.textbtn{width:100%;min-height:var(--h);border-radius:var(--r);padding:0 16px;text-align:center;font-size:var(--t3);display:flex;align-items:center;justify-content:center}
.primary{background:var(--ink);color:#fff;font-weight:600}
.primary:active{background:var(--ink2)}
.secondary{color:var(--ink);border:1px solid #CFCCC4;background:var(--surface)}
.secondary:active,.textbtn:active{background:var(--press)}
.textbtn{color:var(--sub)}
.sub-cta{font-size:var(--t4);color:var(--sub);text-align:center;margin-top:8px;line-height:1.8}
.confirm{font-size:var(--t3);line-height:1.8;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}

/* 依頼文 */
.sheet{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sheet textarea{width:100%;min-height:340px;border:0;resize:none;font-family:var(--jp);font-size:var(--t4);line-height:1.9;color:var(--text);background:transparent;padding:0}
.sheet textarea:focus{outline:none}

/* 方針 */
.pl{list-style:none;margin:24px 0 0;padding:0;counter-reset:p;border-top:1px solid var(--line)}
.pl li{counter-increment:p;padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:32px 1fr;gap:0 8px}
.pl li:before{content:counter(p,decimal-leading-zero);font-family:var(--num);font-size:var(--t4);line-height:1.9;color:var(--sub);font-variant-numeric:tabular-nums}
.pl b{font-size:var(--t3);font-weight:600;line-height:1.5;color:var(--ink)}
.pl p{font-size:var(--t4);color:var(--sub);margin-top:4px;line-height:1.8}

/* はじめに：メールの読み取り */
.intro{padding-top:40px}
.intro .k{font-size:var(--t4);color:var(--sub);letter-spacing:.04em}
.intro h1{font-size:var(--t2);font-weight:600;line-height:1.5;margin-top:8px;color:var(--ink)}
.steps{list-style:none;margin:32px 0 0;padding:0;border-top:1px solid var(--line)}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:start}
.steps svg{width:24px;height:24px;color:var(--ink)}
.steps b{display:block;font-size:var(--t3);font-weight:600;color:var(--ink)}
.steps span{display:block;font-size:var(--t4);color:var(--sub);margin-top:4px;line-height:1.7}
.box{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.acct{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;padding:16px}
.acct .k{font-size:var(--t4);color:var(--sub)}
.acct b{display:block;font-size:var(--t3);font-weight:600;color:var(--ink);margin-top:4px}
.acct .num{font-size:var(--t4);color:var(--sub)}

/* 読み取り中 */
.scan{padding-top:64px}
.scan h1{font-size:var(--t2);font-weight:600;color:var(--ink)}
.meter{margin-top:32px;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meter div{padding:16px 0;display:grid;gap:4px}
.meter div+div{border-left:1px solid var(--line);padding-left:16px}
.meter span{font-size:var(--t4);color:var(--sub)}
.meter b{font-family:var(--num);font-weight:400;font-size:var(--t1);line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.meter b .unit{font-family:var(--jp);font-size:var(--t3)}
.bar{margin-top:24px;height:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink)}
.found{margin-top:24px;font-size:var(--t4);color:var(--sub);min-height:24px}
.found b{color:var(--text);font-weight:400;font-size:var(--t3)}

.empty{margin-top:64px;text-align:center;font-size:var(--t4);color:var(--sub);line-height:1.8}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r);font-size:var(--t4);white-space:nowrap}
.toast.top{bottom:auto;top:48px}

/* カードの中の2つの入口 */
.cb{display:block;width:100%;color:#fff;border-radius:8px}
.cb:active{background:rgba(255,255,255,.06)}
.cb>.k{display:block}
.cb .n{display:flex;align-items:baseline;gap:8px;margin-top:8px}
.cb .n small{margin-left:auto}
.cb .chev{color:rgba(255,255,255,.6);align-self:center}
.cb2{border-top:1px solid rgba(255,255,255,.14);padding-top:16px}
.cb2 .vs{border-top:0;padding-top:0;display:grid}
.cb2 .vs b{display:inline-flex;align-items:center;gap:8px}

/* 会員カードの図 */
.pc{margin:24px 0 0}
.pc figcaption{font-size:var(--t4);color:var(--sub);font-weight:600;letter-spacing:.04em}
.pc-card{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--r);padding:16px}
.pc.fut .pc-card{border-left-color:#CFCCC4}
.pc.warn .pc-card{border-left-color:var(--accent)}
.pc-h{display:flex;justify-content:space-between;gap:16px;font-size:var(--t4);color:var(--sub);padding-bottom:8px;border-bottom:1px solid var(--line)}
.pc-h span:first-child{color:var(--ink);font-weight:600}
.pr{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pr:last-child{border-bottom:0}
.pr span{font-size:var(--t4);color:var(--sub)}
.pr b{font-size:var(--t3);font-weight:600;color:var(--ink);word-break:auto-phrase}
.pr.empty b{color:#B4B2AB;font-weight:400}
.pr.empty b small{font-size:var(--t4);margin-left:8px}
.pr.hit b,.pr .ovr{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:4px}
.pr.other b{font-size:var(--t4);font-weight:400;color:var(--text)}
.pc-c{margin-top:8px;padding-top:8px;border-top:1px solid var(--ink)}
.pc-ct{font-size:var(--t4);color:var(--sub);font-weight:600;padding-bottom:4px}
.ck{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:8px 0;align-items:center}
.ck span{font-size:var(--t4);color:var(--sub)}
.ck b{display:inline-flex;align-items:center;gap:4px;font-size:var(--t3);font-weight:600;color:var(--ink)}
.ck svg{width:16px;height:16px}
.pc-f{margin-top:8px;font-size:var(--t3);font-weight:600;color:var(--ink);word-break:auto-phrase}
.pc.warn .pc-f{color:var(--accent)}

.primary:disabled{opacity:.35;cursor:default}

/* 渡した項目を直す */
.fixbtn{min-height:40px;justify-content:flex-start;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:4px;font-size:var(--t4);margin-top:8px;width:auto}
.pr .mine{display:inline-block;font-size:var(--t4);font-weight:400;color:var(--sub);margin-left:8px;padding:0 8px;border:1px solid var(--line);border-radius:var(--r)}
.pr.ed{display:block}
.tri{display:grid;grid-template-columns:repeat(3,1fr);margin-top:4px;border:1px solid #CFCCC4;border-radius:var(--r);overflow:hidden}
.tri button{min-height:40px;font-size:var(--t4);color:var(--sub);text-align:center}
.tri button+button{border-left:1px solid #CFCCC4}
.tri button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}

/* 会社を追加 */
.dh-row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.addbtn{font-size:var(--t4);color:var(--ink);white-space:nowrap;min-height:40px;padding-left:8px}
.checks{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid var(--line);font-size:var(--t3)}
.chk input,.sel input{width:20px;height:20px;accent-color:var(--ink);margin:0;flex:none}

/* まとめて選ぶ */
.selrow{grid-template-columns:1fr auto 32px}
.sel{display:flex;align-items:center;gap:12px;min-width:0;cursor:pointer}
.go{display:flex;align-items:center;justify-content:flex-end;min-height:40px}

/* 引っ越し・姓が変わったとき */
.mv-ok{margin-top:24px;padding:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--r)}
.mv-ok .k{font-size:var(--t4);color:var(--sub);font-weight:600}
.mv-ok .big{font-size:var(--t2);font-weight:600;color:var(--ink);margin-top:4px}
.mv-ok .names{font-size:var(--t4);color:var(--ink);margin-top:8px}
.donemsg{display:flex;align-items:center;gap:8px;font-size:var(--t3);font-weight:600;color:var(--ink)}
.donemsg svg{width:16px;height:16px}
.mvrow{grid-template-columns:1fr auto}
.go2{min-width:0}
.mark{display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 12px;font-size:var(--t4);border:1px solid #CFCCC4;border-radius:var(--r);color:var(--ink);background:var(--surface);white-space:nowrap}
.mark.on{border-color:var(--ink);font-weight:600}
.mark svg{width:14px;height:14px}

/* カードの中の項目の列（塗り＝渡した／点線＝渡していない） */
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chips i{font-style:normal;font-size:var(--t4);line-height:1;padding:4px 8px;border-radius:var(--r);background:rgba(255,255,255,.92);color:var(--ink)}
.chips.none i{background:transparent;color:rgba(255,255,255,.45);border:1px dashed rgba(255,255,255,.4);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
.chips em{font-style:normal;font-size:var(--t4);color:rgba(255,255,255,.85);display:inline-flex;align-items:center;gap:4px;margin-left:4px}
.chips em svg{width:14px;height:14px}

/* 渡した先に聞く・止める（窓口・返事の記録・届出をした会社・ほかのサービスの記録） */
.kv.stack div{grid-template-columns:96px 1fr;gap:8px}
.kv.stack div span{font-size:var(--t4);line-height:1.9}
.kv.stack div b{text-align:left;font-weight:400;color:var(--text);word-break:auto-phrase}
.opts{margin-top:8px;border-top:1px solid var(--line)}
.opts button{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:center;width:100%;min-height:48px;padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--t3)}
.opts .rd{width:20px;height:20px;border-radius:50%;border:1.5px solid #CFCCC4;box-sizing:border-box}
.opts button[aria-pressed="true"] .rd{border:6px solid var(--ink)}
.opts button[aria-pressed="true"]{font-weight:600;color:var(--ink)}
.chk.one{grid-column:1/-1;border-bottom:0;min-height:48px;margin-top:8px}
.path{margin-top:8px;font-size:var(--t3);color:var(--ink);line-height:1.8;word-break:auto-phrase}
/* 送る前に確かめること：文面より先に目に入る、ひとつだけの箱（引っ越しの「済み」と同じ形） */
.pre{margin-top:24px;padding:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:var(--r)}
.pre h2{font-size:var(--t3);font-weight:600;color:var(--ink)}
.pre .kv{border-top:0}
.pre .kv.stack div{grid-template-columns:72px 1fr}
.pre .kv div:last-child{border-bottom:0;padding-bottom:0}
.pre .hint{border-top:1px solid var(--line);padding-top:8px}
/* 文面：読み物ではなく、送る紙の見本。中で別にスクロールさせず、全文を見せる */
.blk .sheet{margin-top:8px}
.sheet textarea{field-sizing:content;min-height:160px}
/* 14日たった知らせは、答えを記録する本題より小さく */
.mv-ok.soft .big{font-size:var(--t3)}
.mv-ok .big,.sub-cta,.todo li,.kv b,.row .meta{word-break:auto-phrase}
</style>
</head>

      if(o.edit){const cur=(S.edit.tmp[f.l])||f.st;
        return `<div class="pr ed"><span>${f.l}</span><span class="tri" role="group" aria-label="${f.l}">${TRI.map(([v,t])=>`<button data-fl="${f.l}" data-v="${v}" aria-pressed="${cur===v}">${t}</button>`).join("")}</span></div>`;}
      const hit=f.st==="yes"&&o.hitL&&o.hitL(f.l);
      const mine=f.mine?`<small class="mine">ご自身で確認</small>`:"";
      if(f.st==="yes") return `<div class="pr${hit?" hit":""}"><span>${f.l}</span><b>${esc(f.v)}${mine}</b></div>`;
      if(f.st==="unk") return `<div class="pr empty"><span>${f.l}</span><b>分からない${mine}</b></div>`;
      return `<div class="pr empty"><span>${f.l}</span><b>―${mine}</b></div>`;}).join("");
    const rest=toks.filter(x=>!PF.some(p=>p[1](x)));
    if(rest.length) other=`<div class="pr other"><span>ほかに</span><b>${rest.map(x=>`<span class="${o.hit&&o.hit(x)?"ovr":""}">${esc(x)}</span>`).join("・")}</b></div>`;
  } else if(o.mode==="future"){
    rows=PF.map(([l])=>`<div class="pr empty"><span>${l}</span><b>―<small>知らせていません</small></b></div>`).join("");
  } else {
    rows=PF.map(([l,,val])=>`<div class="pr"><span>${l}</span><b>${l==="身分証の写し"?"顔写真・本人確認書類":esc(val(""))}</b></div>`).join("");
  }
  const checks=o.checks?`<div class="pc-c"><div class="pc-ct">MyDataGuardが確かめた結果</div>${o.checks.map(g=>`<div class="ck"><span>${g[0]}</span><b>${g[1]===VIA?"":CHECK}${esc(g[1])}</b></div>`).join("")}</div>`:"";
  return `<figure class="pc${o.mode==="future"?" fut":""}${o.warn?" warn":""}" aria-label="${esc(o.cap)}">
    <figcaption>${o.cap}</figcaption>
    <div class="pc-card">
      <div class="pc-h"><span>${esc(o.who)}</span><span>${o.tag}</span></div>
      ${rows}${other}${checks}
    </div>
    ${o.foot?`<p class="pc-f">${o.foot}</p>`:""}
  </figure>`;
}

/* ---------- 読み取り中（演出。実際には何も読まない） ---------- */
function KL(){
  render(`
  ${head()}
  <div class="scan">
    <h1>メールを確認しています</h1>
    <p class="hint">件名・差出人・日付だけを、この端末の中で読んでいます。${S.watch?"企業・当局の公表とも、この端末の中で照らし合わせます。":""}（デモでは架空のメールです）</p>
  </div>
  <div class="meter">
    <div><span>確認したメール</span><b><span id="m" class="num">0</span><span class="unit">通</span></b></div>
    <div><span>見つかった会社</span><b><span id="f" class="num">0</span><span class="unit">社</span></b></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <p class="found" id="fd" aria-live="off"></p>`,{bare:true});
  const done=()=>{S.linked=true;S.landed=true;S.tab="list";K0();};
  if(RM){$("m").textContent=fmt(MAILS);$("f").textContent=total;$("bar").style.width="100%";setTimeout(done,700);return;}
  const T=3200, t0=performance.now(), names=D.map(d=>d[0]);
  let last=-1;
  const step=now=>{
    if(!$("m")) return;
    const p=Math.min(1,(now-t0)/T), e=1-Math.pow(1-p,2);
    $("m").textContent=fmt(Math.round(MAILS*e));
    $("f").textContent=Math.round(total*e);
    $("bar").style.width=(p*100)+"%";
    const k=Math.min(names.length-1,Math.floor(e*names.length));
    if(k!==last&&k%3===0){last=k;$("fd").innerHTML=`見つかりました　<b>${esc(names[k])}</b>`;}
    if(p<1) setTimeout(()=>step(performance.now()),33); else setTimeout(done,500);
  };
  step(performance.now());
}

  <section class="blk"><h2>渡した項目</h2>
    <div class="checks">${ADD_ITEMS.map(([l,k])=>`<label class="chk"><input type="checkbox" data-it="${k}" ${a.items[k]?"checked":""}><span>${l}</span></label>`).join("")}</div>
    <p class="hint">項目の種類だけを記録します。番号などの中身は入力しません。</p>
  </section>
  <div class="cta">
    <button class="primary" id="ok" ${a.name.trim()?"":"disabled"}>この会社を追加する</button>
    <p class="sub-cta">追加した会社は、この端末の中だけに置きます。デモでは、ページを閉じると消えます。</p>
  </div>`);
  const keep=fn=>{const y=$("screen").scrollTop;fn();$("screen").scrollTop=y;};
  $("bk").onclick=()=>{S.add=null;KL2();};
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{a.cat=b.dataset.cat;keep(KAdd);});
  $("nm").oninput=e=>{a.name=e.target.value;$("ok").disabled=!a.name.trim();};
  document.querySelectorAll("[data-it]").forEach(c=>c.onchange=()=>{a.items[c.dataset.it]=c.checked;});
  $("ok").onclick=()=>{
    const items=ADD_ITEMS.map(x=>x[1]).filter(k=>a.items[k]).join("・")||"氏名";
    D.push([a.name.trim(),a.cat||"その他",`${TODAY} ご自身で追加`,items,3,""]);
    recount();S.add=null;S.filter="すべて";S.q="";S.just=`#lst [data-i="${D.length-1}"]`;
    toast("会社を追加しました");KL2();
  };
}

/* ---------- 本人確認だけの会社（構想） ---------- */
function KF(){
  S.tab="list";
  render(`
  <button class="back" id="bk">${ICON.back}ホーム</button>
  <div class="dh"><div class="k">構想・準備中</div><h1>本人確認だけの会社</h1></div>
  <p class="lead">MyDataGuardで本人確認すると、個人情報を渡さずに登録できる仕組みを準備しています（構想）。この画面はその姿を架空のデータで示したデモです。</p>
  ${future()}`);
  $("bk").onclick=K0;
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>KC(+b.dataset.c));
  document.querySelectorAll("[data-m]").forEach(b=>b.onclick=KM);

}
function future(){
  return `
  <h2 class="sec">会社ごとに伝えている、確認の結果</h2>
  <div class="list">${C.map((c,j)=>`<button class="row${S.stopped[j]?" off":""}" data-c="${j}"><span class="nm">${esc(c.n)}<span class="meta">${esc(answers(c))}</span><span class="meta">${S.stopped[j]?`${md(S.stopped[j])}に停止`:`最終利用 ${md(c.last)}`}</span></span><span class="st ${S.stopped[j]?"":"on"}">${S.stopped[j]?"停止中":"利用中"}</span>${ICON.chev}</button>`).join("")}</div>
  <button class="src" data-m="1" style="margin-top:32px">
    <span><span class="k">確かめているのは</span>
    <span class="nm">MyDataGuardがお預かりする情報（構想）</span>
    <span class="meta">${IDP.map(m=>m[0]).join("・")}・${ymd(IDP_DATE)}に本人確認</span></span>
    ${ICON.chev}
  </button>`;
}

/* ---------- これまで：会社ごとの詳細 ---------- */
function KD(i){
  const d=D[i];
  const st=[];
  const mb=isMaybe(d), nw=NEWS[d[0]];
  if(isLeak(d)) st.push('<span class="hot"><span class="dot"></span>漏えい通知あり</span>');
  if(mb) st.push(`<span class="hot"><span class="ring"></span>漏えいの可能性・${SRC}</span>`);
  st.push(`<span>${SURE[d[4]]}</span>`);
  if(isIdle(d)&&!S.req[i]) st.push(`<span>しばらく使っていない（最後の記録 ${lastYear(d)}年）</span>`);
  if(isGone(d)) st.push('<span>退会済み</span>');
  if(isLaw(d)) st.push('<span>法律で保存</span>');
  if(S.req[i]) st.push('<span class="on">依頼中</span>');
  // 重なり：公表された「漏れた可能性があるもの」と、あなたが渡したと思われるもの
  const mine=d[3].split("・");
  const hit=x=>mb&&nw.what.split("・").some(w=>w.includes(x.replace(/（.*）/,""))||x.includes(w));
  const todo=mb?[
    ["会社に、自分が対象かどうかを問い合わせる","下のボタンから依頼文の下書きを作れます。"],
    nw.what.includes("パスワード")?["パスワードを変更する","同じパスワードをほかのサイトでもお使いなら、そちらも変更してください。"]:null,
    mine.some(x=>x.includes("カード"))?["カード会社に連絡する","身に覚えのない請求がないかを確かめ、番号の変更も相談できます。"]:null,
    ["名前入りの不審なメールや電話に注意する","この会社に何を渡したかは、この画面でいつでも確かめられます。"]
  ].filter(Boolean):[];
  const fromList=S.kdFrom==="list";
  const manual=d[4]===3;
  const editing=S.edit&&S.edit.i===i;
  const fl=fieldsOf(i), nMine=fl.filter(f=>f.mine).length;
  const tag=manual?"会員情報（ご自身で記入）":nMine===fl.length?"会員情報（ご自身で確認）":nMine?"会員情報（一部ご自身で確認）":"会員情報（推定）";
  const foot=editing?"":isLeak(d)?(nMine?"ご自身で確認した内容のうち、「渡した」項目が外に出たかもしれません":"この内容が、外に出たかもしれません")
    :mb?"下線の項目が、公表された内容と重なります":"この会社には、個人情報を渡しています";
  render(`
  <button class="back" id="bk">${ICON.back}${fromList?"一覧":"ホーム"}</button>
  <div class="dh"><div class="k">個人情報を渡している会社・${esc(d[1])}</div><h1>${esc(d[0])}</h1><div class="stline">${st.join("")}</div></div>
  ${pcard({mode:"past",items:d[3],fields:fl,edit:editing,hit:mb?hit:null,hitL:mb?(l=>hitLabel(nw,l)):null,warn:(isLeak(d)||mb)&&!editing,who:d[0],tag:tag,
    cap:editing?"渡した項目を、ご自身で直してください":"この会社からは、あなたがこう見えています",foot:foot})}
  ${editing?`<div class="cta" style="margin-top:16px">
    <button class="primary" id="save">この内容で保存する</button>
    <button class="textbtn" id="cancel">やめておく</button>
    <p class="sub-cta">直した内容は、この端末の中だけに置きます。</p>
  </div>`:`<button class="textbtn fixbtn" id="fix">渡した項目を直す</button>
  <p class="hint">${manual?"ご自身で追加した会社です。":nMine?"「ご自身で確認」の付いた欄は、あなたが直した内容です。ほかの欄は推定です。":"業種とメールの件名からの推定です。合っていなければ、上の「渡した項目を直す」で直せます。"}今も持っているかは分かりません。退会後も残っていることがあります。</p>`}
  ${isLaw(d)?`<p class="hint">この会社は法律により、取引が終わった後も一定の期間、記録を保存する義務があります。期間が過ぎたら消去するよう依頼できます。</p>`:""}
  <div class="span2"><div><span>いつから</span><b>${N(firstYear(d),"年")}</b></div><div><span>最後の記録</span><b>${N(lastYear(d),"年")}</b></div></div>
  ${mb?`<section class="blk"><h2>企業の公表</h2>
    <div class="kv">
      <div><span>公表日</span><b class="num">${ymd(nw.date)}</b></div>
      <div><span>情報源</span><b>${SRC}</b></div>
      <div><span>漏れた可能性があるもの</span><b>${esc(nw.what)}</b></div>
    </div>
    <p class="hint">${nw.note}あなたが対象かどうかは、まだ分かりません。会社からのお知らせも届いていません。</p>
  </section>`:""}
  ${isLeak(d)?`<section class="blk"><h2>漏えいの知らせ</h2>
    <div class="kv">
      <div><span>届いた日</span><b class="num">${ymd(leakDate(d))}</b></div>
      <div><span>情報源</span><b>会社からのお詫びのメール</b></div>
    </div>
  </section>`:""}
  ${mb?`<section class="blk"><h2>いまできること</h2>
    <ol class="todo">${todo.map(t=>`<li><span>${t[0]}<small>${t[1]}</small></span></li>`).join("")}</ol>
  </section>`:""}
  <section class="blk"><h2>記録</h2>
    <ul class="tl">${reqLines(i).concat(mb?[`?${nw.date} 企業の公表：漏えいの可能性（あなたが対象かは未確定）`]:[]).concat(d[2].split("|").reverse()).map(t=>{const cls=t[0]==="!"?"hot":t[0]==="?"?"maybe":"";t=t.replace(/^[!?]/,"");const m=t.match(/^([\d\-〜]+|毎週)\s*(.*)$/);return `<li class="${cls}"><span class="dt">${m?m[1]:""}</span><span class="tx">${esc(m?m[2]:t)}</span></li>`;}).join("")}</ul>
    <p class="hint">${manual?"ご自身で追加した記録です。":mb?"企業の公表と、あなたのメールの件名から作った記録です。":"あなたのメールの件名から作った記録です。"}</p>
  </section>
  ${editing?"":madoBlock(d)}
  ${editing?"":`<div class="cta">
    ${mb?`<button class="primary" id="chk">対象かどうか会社に問い合わせる</button>
    <button class="secondary" id="del">止める・消してもらう</button>`
    :`<button class="primary" id="del">${isLaw(d)?"期間が過ぎたら消してもらう":"止める・消してもらう"}</button>
    <button class="secondary" id="ask">聞く（何を持っているか・誰に渡したか）</button>`}
    <p class="sub-cta">依頼文の下書きを作ります。送るのはあなたです。</p>
  </div>`}`);
  $("bk").onclick=()=>{S.edit=null;(fromList?KL2:K0)();};
  if(!editing){$("del").onclick=()=>KR(i,isLaw(d)?"later":"del");
    if(mb) $("chk").onclick=()=>KR(i,"check"); else $("ask").onclick=()=>KAsk(i);}
  // 直す
  const keep=fn=>{const y=$("screen").scrollTop;fn();$("screen").scrollTop=y;};
  if(editing){
    document.querySelectorAll("[data-fl]").forEach(b=>b.onclick=()=>{S.edit.tmp[b.dataset.fl]=b.dataset.v;keep(()=>KD(i));});
    $("save").onclick=()=>{S.fix[i]=Object.assign({},S.fix[i]||{},S.edit.tmp);S.edit=null;toast("ご自身で確認した内容にしました");keep(()=>KD(i));};
    $("cancel").onclick=()=>{S.edit=null;keep(()=>KD(i));};
  } else $("fix").onclick=()=>{S.edit={i:i,tmp:{} };keep(()=>KD(i));};
}

// 文面は、本人の名前で送る前提で、決まった形に差し込むだけ（デモの名前とメールは架空）
function letter(d,kind){
  const ask33=kind==="rec"
    ?`個人情報保護法第33条第5項に基づき、貴社が私の個人データを第三者に提供した記録と、第三者から受け取った記録（相手の名称、日付、項目）を開示してください。\n`
    :`個人情報保護法第33条第1項に基づき、貴社が保有する私の保有個人データの項目、取得日、利用目的、第三者への提供の有無を開示してください。\n`;
  let s=`${d[0]}\n個人情報のお問い合わせ窓口　ご担当者様\n\n私は貴社の${d[1]}のサービスを利用している（または利用していた）者です。\n氏名：${USER}\n登録メールアドレス：${MAIL}\n\n${ask33}`;
  if(kind==="check") s+=`\nあわせて、貴社が${ymd(NEWS[d[0]].date)}に公表された個人情報の漏えいについて、私の個人データが対象に含まれるかどうか、含まれる場合はその項目をお知らせください。\n`;
  if(kind==="del") s+= isLeak(d)?`\nあわせて、貴社で個人データの漏えいが発生したことを受け、同法第35条に基づき、私の保有個人データの利用の停止と消去をお願いします。\n`:`\nあわせて、貴社が私の保有個人データを利用する必要がなくなっている場合は、同法第35条に基づき、利用の停止と消去をお願いします。\n`;
  if(kind==="del"||kind==="later") s+=`法令により保存が必要な記録は、その項目と保存期間を教えてください。保存期間が過ぎたら消去してください。\n`;
  return s+`\n結果は、このメールへの返信でお知らせください。\n\n${USER}`;
}
// 14日たっても返事がないときの、もう一度お願いする文面（前回の文面をそのまま添える）
function againLetter(k){
  const r=S.req[k], first=letterOf(k,r.kind);
  return `${reqName(k)}\nご担当者様\n\n${md(r.date)}にお送りした${REQ_KIND[r.kind]||"止める・消してもらう依頼"}について、14日たちましたが、まだお返事をいただいていません。お手数ですが、あらためてご対応をお願いします。\n受付の状況だけでも、お知らせいただけると助かります。\n\n――　${md(r.date)}にお送りした内容　――\n${first}`;
}
const letterOf=(k,kind)=>String(k)[0]==="o"?optLetter(OPT[+String(k).slice(1)]):letter(D[k],kind);

/* ---------- 窓口（会社の詳細の中）。窓口の表にある会社は宛先・本人確認・手数料・確認日を、無い会社は探し方を出す ---------- */
function madoBlock(d){
  const m=MADO[d[0]];
  if(!m) return `<section class="blk" id="mado"><h2>個人情報の窓口</h2>
    <p class="hint">窓口は、この会社のプライバシーポリシーの「開示等の請求」の欄にあります。</p>
    <ol class="todo"><li><span>会社のサイトの一番下にある「プライバシーポリシー」を開く</span></li><li><span>「開示等の請求」または「保有個人データ」の欄を探す</span></li><li><span>受付の方法（フォーム・メール・郵送）と、本人確認・手数料を確かめる</span></li></ol>
    <p class="hint">宛先・本人確認・手数料・確認日の欄は、窓口を確かめた会社にだけ出ます。</p></section>`;
  return `<section class="blk" id="mado"><h2>個人情報の窓口</h2>
    <div class="kv stack">
      <div><span>受付の方法</span><b>${m.how}</b></div>
      <div><span>宛先</span><b>${esc(m.to)}</b></div>
      <div><span>本人確認</span><b>${m.id}</b></div>
      <div><span>手数料</span><b>何を持っているか：${m.fee[0]}<br>誰に渡したか：${m.fee[1]}</b></div>
      <div><span>確認日</span><b class="num">${ymd(MADO_DATE)}</b></div>
    </div>
    <p class="hint">窓口の情報は${ymd(MADO_DATE)}に会社のサイト（${m.page}）で確かめたものです（デモでは架空）。送る前に、会社のサイトでもご確認ください。</p></section>`;
}
// 「送る前に」の3行：[見出し, 中身]
function beforeRows(d,kind){
  const m=MADO[d[0]], open=kind==="ask"||kind==="rec";
  const fee=open?(m?m.fee[kind==="rec"?1:0]:"開示は手数料がかかることがあります"):kind==="check"?"会社が決めます":"止める・消すのに手数料はかかりません";
  if(!m) return [["宛先","会社のサイトの「開示等の請求」の欄"],["本人確認","会社が決めます"],["手数料",fee]];
  return [["宛先",`${m.how}：${m.to}`],["本人確認",m.id],["手数料",fee]];
}
// 依頼文の画面（一覧の会社・届出をした会社で共通）
function letterScreen(o){
  render(`
  <button class="back" id="bk">${ICON.back}${esc(o.back)}</button>
  <div class="dh"><div class="k">${o.k||"依頼文の下書き"}</div><h1>${o.title}</h1></div>
  ${o.lead?`<p class="lead">${o.lead}</p>`:""}
  <section class="pre" id="before"><h2>送る前に確かめること</h2>
    <div class="kv stack">${o.pre.map(r=>`<div><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join("")}</div>
    ${o.preNote?`<p class="hint">${o.preNote}</p>`:""}
  </section>
  ${o.extra||""}
  <section class="blk"><h2>文面</h2>
    <p class="hint">送るのはあなたです。文面をコピーして、上の宛先に、あなたの名前で送ってください。</p>
    <div class="sheet"><textarea id="tx" aria-label="依頼文">${esc(o.text)}</textarea></div>
  </section>
  <div class="cta" style="margin-top:24px">
    <button class="secondary" id="cp">文面をコピー</button>
    <button class="primary" id="sent">送ったので記録する</button>
    <p class="sub-cta">MyDataGuardから会社に送ることはありません。<br>返事が来たら「依頼」で記録できます。</p>
  </div>`);
  $("bk").onclick=o.onBack;
  $("cp").onclick=()=>copyText();
  $("sent").onclick=o.onSent;
}
function KR(i,kind){
  const d=D[i];
  const again=kind==="again";
  letterScreen({back:again?"返事を記録する":d[0],k:again?"もう一度お願いする文面":"依頼文の下書き",
    title:again?"前回のお願いから14日たちました":(REQ_TITLE[kind]||"止める・消してもらう"),
    lead:kind==="rec"?"誰に渡したか・どこから得たかは、記録があれば教えてもらえます。出てこないこともあります。":"",
    pre:beforeRows(d,again?S.req[i].kind:kind),
    text:again?againLetter(i):letter(d,kind),
    onBack:()=>again?KAns(i):KD(i),
    // 記録したら一覧へ戻し、該当の行（「依頼中」に変わる）を光らせる
    onSent:()=>{
      if(again){const r=S.req[i];S.req[i]={kind:r.kind,date:TODAY,prev:r.date};toast("もう一度お願いしたことを記録しました");KQ(i);return;}
      S.req[i]={kind:kind,date:TODAY};S.filter="すべて";S.q="";S.just=`#lst [data-i="${i}"]`;toast("記録しました。返事をお待ちください");KL2();}
  });
}

/* ---------- 聞く：何を持っているか／誰に渡したか ---------- */
function KAsk(i){
  const d=D[i], m=MADO[d[0]];
  const fee=j=>m?`手数料 ${m.fee[j]}・本人確認 ${m.id}`:"手数料・本人確認は会社が決めます";
  render(`
  <button class="back" id="bk">${ICON.back}${esc(d[0])}</button>
  <div class="dh"><div class="k">聞く</div><h1>何を聞きますか</h1></div>
  <button class="src" data-k="ask"><span><span class="k">個人情報保護法 第33条第1項</span><span class="nm">何を持っているかを聞く</span><span class="meta">${esc(fee(0))}</span></span>${ICON.chev}</button>
  <button class="src" data-k="rec" style="margin-top:8px"><span><span class="k">個人情報保護法 第33条第5項</span><span class="nm">誰に渡したかを聞く</span><span class="meta">どこから得たかも、あわせて聞けます。${esc(fee(1))}</span></span>${ICON.chev}</button>
  <p class="hint" style="margin-top:16px">誰に渡したかは、記録があれば教えてもらえます。出てこないこともあります。</p>`);
  $("bk").onclick=()=>KD(i);
  document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>KR(i,b.dataset.k));
}

/* ---------- 返事を記録する（7種類）。14日たって返事がなければ、もう一度お願いする文面へ ---------- */
function KAns(k){
  S.tab="req";
  const r=S.req[k], dd=days(r.date), sel=S.ansTmp&&S.ansTmp.k===String(k)?S.ansTmp:null;
  const late=dd>=AGAIN_D&&!r.ans;
  const pick=sel&&ANS.find(a=>a[0]===sel.kind);
  render(`
  <button class="back" id="bk">${ICON.back}依頼</button>
  <div class="dh"><div class="k">返事を記録する</div><h1>${esc(reqName(k))}</h1>
    <div class="stline"><span>${REQ_KIND[r.kind]||"止める・消してもらう依頼"}</span>${r.ans?`<span class="on">${esc(ansLabel(r.ans))}</span>`:""}</div></div>
  <div class="span2"><div><span>送った日</span><b class="num">${ymd(r.date)}</b></div><div><span>送ってから</span><b class="num">${dd}日</b></div></div>
  ${late?`<section class="mv-ok soft"><p class="big">前回のお願いから14日たちました</p>
    <p class="hint">返事がまだ無いときは、前回の文面を添えて、もう一度お願いできます。</p>
    <div class="cta" style="margin-top:16px"><button class="secondary" id="again">もう一度お願いする文面を作る</button></div></section>`:""}
  <section class="blk"><h2>会社の答え</h2>

// 会社の詳細の「記録」に出す、依頼と返事の行（新しい順）
function reqLines(i){
  const r=S.req[i];
  if(!r) return [];
  const out=[];
  if(r.ans) out.push(`${r.ans.date} ${ansLabel(r.ans)}（会社の回答）${r.ans.memo?`・${r.ans.memo}`:""}`.replace("返事なし（会社の回答）","返事なし"));

  return out;
}

  <p class="note">返事のメールが届いたら、行を押して記録してください。送ってから${AGAIN_D}日たっても返事がなければ、もう一度お願いする文面を作れます。</p>`
  :`<p class="empty">まだ依頼はありません。<br>ホームの「個人情報を渡している会社」から会社を選ぶと、依頼文を作れます。</p>`}`);
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{S.ansTmp=null;KAns(b.dataset.q);});
  if(lit!==undefined) flash(`[data-q="${lit}"]`);
}

 t_window:()=>{NORIKA();$("mado").scrollIntoView();},

 t_ext:()=>{home();tap("#ext");},

 t_leakwhy:()=>{home();tap("#ext");tap("#leak");}
